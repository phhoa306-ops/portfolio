<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phuong Hoa&#39;s Portfolio</title>
<meta name="description" content="Nguyen Phuong Hoa: marketing communication, social media, branding and photography.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Space+Mono:wght@400;700&family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a cream editorial page in Hoa's own brand (forest green + flower pink),
   big type, an index of work that opens into case studies through a circular wipe. */
:root{
  --cream:#FFF9E6;
  --paper:#FFFDF5;
  --green:#006838;
  --ink:#10291B;
  --pink:#F29FFF;
  --mint:#CAF4CE;
  --muted:#56685C;
  --line:rgba(0,104,56,.16);
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease:cubic-bezier(.7,0,.2,1);
  --out:cubic-bezier(.2,.8,.2,1);
  --gut:clamp(18px,4vw,56px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--cream)}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:6px}
::selection{background:var(--pink);color:var(--ink)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
h1,h2,h3{font-family:var(--display);text-wrap:balance;font-weight:800;line-height:.95;letter-spacing:-.02em;color:var(--green)}
.wrap{padding-inline:var(--gut);max-width:1440px;margin-inline:auto}

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:100;background:var(--green);color:var(--cream);display:grid;place-items:center;transition:transform 1s var(--ease), border-radius 1s var(--ease)}
.loader.out{transform:translateY(-105%);border-radius:0 0 50% 50%/0 0 12vh 12vh}
.loader-inner{display:flex;flex-direction:column;align-items:center;gap:18px}
.loader svg{width:92px;height:92px;animation:spin 2.4s linear infinite}
.loader .sig{font-family:var(--display);font-size:28px;font-weight:600;overflow:hidden}
.loader .sig span{display:inline-block;animation:rise .8s var(--out) both}
.loader .count{font-family:var(--mono);font-size:13px;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}

/* ---------- cursor + preview ---------- */
.cursor{position:fixed;left:0;top:0;z-index:90;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--green);pointer-events:none;display:grid;place-items:center;transition:width .35s var(--out),height .35s var(--out),margin .35s var(--out),background .3s;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.cursor span{opacity:0;transition:opacity .2s}
.cursor.big{width:84px;height:84px;margin:-42px 0 0 -42px;background:var(--pink)}
.cursor.big span{opacity:1}
.cursor.hide{opacity:0}
@media (hover:none),(pointer:coarse){.cursor,.preview{display:none!important}}
.preview{position:fixed;left:0;top:0;z-index:40;width:340px;aspect-ratio:4/3;pointer-events:none;border-radius:14px;overflow:hidden;opacity:0;transform:scale(.6);transition:opacity .35s, transform .5s var(--out);box-shadow:0 30px 60px -20px rgba(16,41,27,.35)}
.preview.on{opacity:1;transform:scale(1)}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(100% 0 0 0);transition:clip-path .55s var(--ease)}
.preview img.on{clip-path:inset(0 0 0 0)}

/* ---------- progress + nav ---------- */
.progress{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--pink);transform-origin:0 50%;transform:scaleX(0);z-index:60}
.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px var(--gut);transition:transform .5s var(--ease),background .3s}
.nav.scrolled{background:rgba(255,249,230,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav.hidden{transform:translateY(-100%)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;color:var(--green);text-decoration:none}
.brand svg{width:28px;height:28px;transition:transform .8s var(--out)}
.brand:hover svg{transform:rotate(144deg)}
.nav-links{display:flex;gap:4px;align-items:center}
.nav-links button{padding:8px 14px;border-radius:99px;font-size:15px;position:relative;overflow:hidden}
.nav-links button span{display:block;transition:transform .45s var(--out)}
.nav-links button span::after{content:attr(data-t);position:absolute;left:0;right:0;top:100%;text-align:center;color:var(--green);font-weight:600}
.nav-links button:hover span{transform:translateY(-100%)}
.pill{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:99px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid var(--green);transition:background .3s, color .3s, transform .3s var(--out);white-space:nowrap}
.pill.solid{background:var(--green);color:var(--cream)}
.pill.solid:hover{background:var(--ink);border-color:var(--ink)}
.pill.ghost{color:var(--green)}
.pill.ghost:hover{background:var(--green);color:var(--cream)}
.pill .arr{display:inline-block;transition:transform .4s var(--out)}
.pill:hover .arr{transform:translate(3px,-3px) rotate(0deg)}
.menu-btn{display:none}
.nav-r{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;align-items:center;gap:5px;padding:10px 15px;border-radius:99px;border:1.5px solid var(--green);background:transparent;color:var(--green);font:700 13px/1 "Space Mono",ui-monospace,monospace;letter-spacing:.04em;cursor:pointer;transition:background .3s,color .3s}
.lang b{opacity:.4;transition:opacity .3s}
.lang b.on{opacity:1}
.lang:hover{background:var(--mint)}
body.menu-open .lang{color:var(--cream);border-color:var(--cream)}
body.menu-open .nav{z-index:60;background:transparent;transform:none}
.mobile-menu{position:fixed;inset:0;z-index:55;background:var(--green);color:var(--cream);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:var(--gut);clip-path:circle(0% at calc(100% - 44px) 34px);transition:clip-path .8s var(--ease);visibility:hidden}
.mobile-menu.open{clip-path:circle(150% at calc(100% - 44px) 34px);visibility:visible}
.mobile-menu button{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,64px);text-align:left;line-height:1.05;color:var(--cream);transform:translateY(40px);opacity:0;transition:transform .6s var(--out),opacity .6s}
.mobile-menu.open button{transform:none;opacity:1}
.mobile-menu .mono{margin-top:30px;opacity:.7}
@media (max-width:820px){
  .nav-links{display:none}
  .menu-btn{display:inline-flex;z-index:56;position:relative}
  .nav .pill.hire{display:none}
  body.menu-open .menu-btn{color:var(--cream);border-color:var(--cream)}
  body.menu-open .brand{color:var(--cream)}
}

/* ---------- hero ---------- */
.hero{padding-top:clamp(110px,14vh,150px);padding-bottom:clamp(40px,6vw,80px);display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,4vw,64px);align-items:center}
.hero .kicker{display:flex;gap:12px;align-items:baseline;color:var(--muted);margin-bottom:26px}
.hero .kicker .dot{flex:none;transform:translateY(-1px);width:8px;height:8px;border-radius:50%;background:#2DBE60;box-shadow:0 0 0 0 rgba(45,190,96,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(45,190,96,0)}100%{box-shadow:0 0 0 0 rgba(45,190,96,0)}}
.hero h1{font-size:clamp(38px,7.6vw,118px)}
@media (max-width:600px){.hero h1{font-size:10.4vw}}
.line{display:block;overflow:hidden;padding-bottom:.06em}
.line>span{display:inline-block;transform:translateY(0);transition:transform 1.1s var(--out)}
.pre .line>span{transform:translateY(110%)}
.hero h1 .accent{font-style:normal;position:relative;white-space:nowrap}
.hero h1 .accent::before{content:"";position:absolute;left:-.08em;right:-.08em;bottom:.08em;height:.38em;background:var(--pink);border-radius:.2em;z-index:-1;transform-origin:0 50%;transition:transform 1s .9s var(--ease)}
.pre .hero h1 .accent::before{transform:scaleX(0)}
.hero h1 .amp{font-family:var(--body);font-weight:300;font-style:italic;letter-spacing:-.04em}
.hero .intro{margin-top:28px;max-width:46ch;font-size:clamp(17px,1.4vw,20px);color:var(--ink)}
.rotator{display:inline-grid;vertical-align:top;line-height:1.6em;overflow:hidden;height:1.6em;color:var(--green);font-weight:600}
.rotator span{grid-area:1/1;transform:translateY(110%);transition:transform .7s var(--ease)}
.rotator span.on{transform:none}
.rotator span.gone{transform:translateY(-110%)}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.fade-up{transition:opacity .9s var(--out),transform .9s var(--out)}
.pre .fade-up{opacity:0;transform:translateY(24px)}
.hero-art{position:relative;aspect-ratio:1/0.82;width:100%}
.hero-art .logo{position:absolute;inset:12% 4% 14% 4%;width:92%;height:auto;object-fit:contain;transition:transform 1.2s var(--out), opacity 1s}
.pre .hero-art .logo{transform:scale(.85) rotate(-6deg);opacity:0}
.sticker{position:absolute;z-index:2;padding:8px 18px;border:1.5px solid var(--ink);border-radius:99px;background:var(--paper);font-family:var(--body);font-size:clamp(13px,1.1vw,16px);white-space:nowrap;cursor:grab;touch-action:none;user-select:none;box-shadow:3px 3px 0 var(--ink);transition:box-shadow .2s, scale .3s var(--out);animation:bob 5s ease-in-out infinite}
.sticker:hover{scale:1.06}
.sticker.drag{cursor:grabbing;box-shadow:6px 8px 0 var(--ink);animation-play-state:paused;scale:1.1}
@keyframes bob{50%{translate:0 -8px}}
.hero-art .bloom{position:absolute;width:15%;z-index:1;animation:spin 14s linear infinite}
.hero-art .hint{position:absolute;right:0;bottom:-6px;color:var(--muted)}
@media (max-width:900px){.hero{grid-template-columns:1fr}.hero-art{max-width:560px;margin-inline:auto}}

/* ---------- marquee ---------- */
.marquee{border-block:1.5px solid var(--green);background:var(--green);color:var(--cream);overflow:hidden;padding:16px 0;transform:rotate(-1.2deg);margin:20px -10px 0}
.marquee-track{display:flex;width:max-content;will-change:transform}
.marquee-track span{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.6vw,36px);display:flex;align-items:center;gap:28px;padding-right:28px;white-space:nowrap}
.marquee-track svg{width:.9em;height:.9em;flex:none}

/* ---------- sections ---------- */
section{position:relative}
.sec{padding-block:clamp(80px,11vw,150px)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(36px,5vw,64px)}
.sec-title{font-size:clamp(48px,8vw,120px);text-transform:uppercase}
.sec-title em{display:block;font-family:var(--body);font-weight:300;font-style:italic;text-transform:none;font-size:.32em;letter-spacing:0;color:var(--ink);margin-bottom:.15em;margin-left:.1em}
.sec-head p{max-width:36ch;color:var(--muted)}
.rv{transition:opacity 1s var(--out),transform 1s var(--out),clip-path 1.2s var(--ease)}
.rv.pre-rv{opacity:0;transform:translateY(40px)}
.split .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em}
.split .w>span{display:inline-block;transition:transform .9s var(--out)}
.split.pre-rv .w>span{transform:translateY(105%)}
.split.pre-rv{opacity:1;transform:none}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(30px,6vw,96px);align-items:start}
.portrait{position:relative;border-radius:200px 200px 24px 24px;overflow:hidden;aspect-ratio:4/5;border:1.5px solid var(--green)}
.portrait img{width:100%;height:120%;object-fit:cover;object-position:52% 50%;transform:translateY(var(--py,0))}
.portrait.rv.pre-rv{clip-path:inset(100% 0 0 0);opacity:1;transform:none}
.portrait.rv{clip-path:inset(0 0 0 0)}
.portrait-wrap{position:relative}
.portrait-wrap .badge{position:absolute;right:-18px;bottom:40px;width:120px;height:120px;z-index:2}
.portrait-wrap .badge svg{width:100%;height:100%;animation:spin 16s linear infinite}
.about-body h2{font-size:clamp(30px,3.6vw,52px);text-transform:none;margin-bottom:28px;line-height:1.05}
.about-body h2 .soft, .about-body h2 .soft .w>span{color:var(--ink);font-weight:400;font-family:var(--body);font-style:italic;letter-spacing:-.02em}
.about-body p{max-width:60ch;margin-bottom:18px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0}
.chip{padding:6px 14px;border-radius:99px;background:var(--mint);font-size:14px;color:var(--ink)}
.chip.o{background:transparent;border:1.2px solid var(--line)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:14px 20px;border-top:1.5px solid var(--green);padding-top:22px;margin-top:10px}
.kv dt{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.kv dd{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:900px){.about{grid-template-columns:1fr}.portrait{max-width:440px}.kv{grid-template-columns:1fr}}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1.5px solid var(--green)}
.stat{padding:clamp(24px,3vw,44px) clamp(14px,2vw,28px);border-right:1.5px solid var(--green);display:flex;flex-direction:column;gap:12px;transition:background .4s}
.stat:last-child{border-right:0}
.stat:hover{background:var(--pink)}
.stat b{font-family:var(--display);font-weight:800;color:var(--green);font-size:clamp(46px,5.6vw,88px);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat span{font-size:15px;color:var(--muted);max-width:22ch}
.stat:hover span{color:var(--ink)}
@media (max-width:900px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1.5px solid var(--green)}}

/* ---------- photos (horizontal) ---------- */
.photos{background:var(--ink);color:var(--cream)}
.photos .sec-title{color:var(--cream)}
.photos .sec-title em{color:var(--pink)}
.photos .sec-head p{color:rgba(255,249,230,.7)}
.h-outer{position:relative}
.h-sticky{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.h-track{display:flex;gap:18px;padding-inline:var(--gut);will-change:transform;align-items:center}
.ph{flex:none;height:min(58vh,520px);position:relative;border-radius:12px;overflow:hidden;cursor:zoom-in;background:#1c3a29}
.ph img{height:100%;width:auto;object-fit:cover;transition:transform .9s var(--out),filter .5s;filter:saturate(.9)}
.ph:hover img{transform:scale(1.05);filter:saturate(1.1)}
.ph-label{flex:none;width:min(320px,70vw);padding-right:20px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:14px}
.ph-label h3{color:var(--pink);font-size:clamp(34px,3.6vw,54px)}
.ph-label p{font-size:15px;color:rgba(255,249,230,.75)}
.h-head{padding-inline:var(--gut);margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.h-bar{margin:28px var(--gut) 0;height:2px;background:rgba(255,249,230,.18);position:relative}
.h-bar i{position:absolute;inset:0;background:var(--pink);transform-origin:0 50%;transform:scaleX(0)}
.photos.static .h-sticky{position:relative;height:auto;padding-block:clamp(80px,11vw,150px)}
.photos.static .h-track{overflow-x:auto;scroll-padding-inline:var(--gut);scroll-snap-type:x mandatory;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.photos.static .ph,.photos.static .ph-label{scroll-snap-align:start}
.photos.static .ph{height:min(56vh,420px)}

/* ---------- experience ---------- */
.xp{list-style:none;border-top:1.5px solid var(--green)}
.xp li{display:grid;grid-template-columns:180px 1fr 1.2fr;gap:24px;padding:28px 0;border-bottom:1px solid var(--line);position:relative}
.xp li::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--green);transform:scaleX(0);transform-origin:0 50%;transition:transform .8s var(--ease)}
.xp li:hover::after{transform:scaleX(1)}
.xp .when{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:6px;font-variant-numeric:tabular-nums}
.xp h3{font-size:clamp(24px,2.4vw,34px);line-height:1.05}
.xp .role{color:var(--ink);margin-top:6px;font-size:15px}
.xp ul{list-style:none;display:grid;gap:6px;font-size:15.5px}
.xp ul li{display:block;padding:0 0 0 20px;border:0;position:relative}
.xp ul li::after{display:none}
.xp ul li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--pink)}
.xp .res{margin-top:14px;display:inline-block;padding:6px 14px;border-radius:10px;background:var(--mint);font-size:14.5px;font-weight:500}
@media (max-width:900px){.xp li{grid-template-columns:1fr;gap:10px}}

/* ---------- tools & skills (logos) ---------- */
.sklogos{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.skl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px 10px 20px;border-radius:20px;background:var(--paper);border:1.5px solid var(--line);transition:transform .5s var(--out),border-color .3s,background .3s}
.skl:hover{transform:translateY(-6px) rotate(-2deg);border-color:var(--green);background:var(--mint)}
.skl img{width:clamp(44px,4.6vw,64px);height:clamp(44px,4.6vw,64px);object-fit:contain}
.skl span{font-size:14px;font-weight:600;color:var(--green);text-align:center}
@media (max-width:960px){.sklogos{grid-template-columns:repeat(4,1fr)}}
@media (max-width:520px){.sklogos{grid-template-columns:repeat(2,1fr)}}
/* ---------- recognition ---------- */
.recog{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{padding:26px;border-radius:20px;background:var(--paper);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:10px;min-height:170px;transition:transform .5s var(--out),border-color .3s,background .3s}
.card:hover{transform:translateY(-6px) rotate(-1deg);border-color:var(--green);background:var(--mint)}
.card .mono{color:var(--muted)}
.card h3{font-size:24px;line-height:1.1;margin-top:auto}
.card p{font-size:14.5px;color:var(--muted)}
@media (max-width:900px){.recog{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.recog{grid-template-columns:1fr}}

/* ---------- contact ---------- */
.contact{display:grid;grid-template-columns:1.2fr 1fr;min-height:560px;border-top:1.5px solid var(--green)}
.contact-l{padding:clamp(60px,8vw,110px) var(--gut);display:flex;flex-direction:column;gap:26px}
.contact h2{font-size:clamp(56px,9vw,150px);text-transform:uppercase}
.contact h2 em{display:block;font-family:var(--body);font-style:normal;font-weight:400;text-transform:none;letter-spacing:-.02em;color:var(--ink);font-size:.6em;line-height:1}
.c-rows{display:grid;gap:18px;max-width:520px}
.c-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1.5px solid var(--green);flex-wrap:wrap}
.c-row .mono{color:var(--muted);width:100%}
.c-row a,.c-row strong{font-size:clamp(18px,1.8vw,24px);font-weight:500;text-decoration:none;word-break:break-all}
.copy{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:99px;border:1.2px solid var(--green);color:var(--green);transition:background .3s,color .3s}
.copy:hover{background:var(--green);color:var(--cream)}
.socials{display:flex;gap:10px;flex-wrap:wrap}
.contact-r{background:var(--mint);position:relative;overflow:hidden;border-left:1.5px solid var(--green);min-height:340px}
.flowerfield{position:absolute;inset:-40px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-content:space-around;justify-items:center}
.flowerfield svg{width:clamp(48px,6vw,84px);height:auto;transition:transform .2s linear}
.flowerfield svg:nth-child(even){translate:0 40px}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px var(--gut);border-top:1.5px solid var(--green);color:var(--muted)}
.totop{color:var(--green)}
@media (max-width:900px){.contact{grid-template-columns:1fr}.contact-r{border-left:0;border-top:1.5px solid var(--green);min-height:260px}}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:95;background:rgba(16,41,27,.94);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.lb.open{opacity:1;visibility:visible}
.lb img{max-width:92vw;max-height:84vh;border-radius:10px;transform:scale(.94);transition:transform .5s var(--out)}
.lb.open img{transform:none}
.lb button{position:absolute;color:var(--cream);font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:12px 16px;border:1.2px solid rgba(255,249,230,.4);border-radius:99px}
.lb button:hover{background:var(--cream);color:var(--ink)}
.lb .x{top:18px;right:18px}.lb .p{left:18px;top:50%}.lb .nx{right:18px;top:50%}
.lb .cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:rgba(255,249,230,.75);font-size:14px;padding-inline:20px}
.toast{position:fixed;left:50%;bottom:26px;z-index:120;visibility:hidden;transform:translate(-50%,240%);background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:99px;font-size:14px;transition:transform .5s var(--out)}
.toast.on{transform:translate(-50%,0);visibility:visible}

/* ---------- work: tabs ---------- */
.tabs{position:relative;display:flex;gap:4px;padding:5px;border-radius:99px;border:1px solid var(--line);background:var(--surface);width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;margin-bottom:clamp(28px,4vw,48px)}
.tabs button{position:relative;z-index:1;height:44px;padding:0 20px;border-radius:99px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted);transition:color .35s}
.tabs button sup{font-family:var(--mono);font-size:11px;font-weight:400;top:0;opacity:.8}
.tabs button[aria-selected="true"]{color:var(--bg)}
.tabs .ind{position:absolute;z-index:0;top:5px;bottom:5px;left:0;border-radius:99px;background:var(--ink);transition:transform .55s var(--out),width .55s var(--out)}
.pane[hidden]{display:none}
.pane-intro{max-width:60ch;color:var(--muted);margin-bottom:28px}

/* ---------- social: brand marquee ---------- */
.sec-brands{margin:0 0 clamp(40px,5vw,64px)}
.sec-brands-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sec-brands-g span{height:88px;border-radius:18px;background:#fff;border:1.5px solid var(--green);display:grid;place-items:center;padding:14px 20px;box-shadow:4px 5px 0 var(--green);transition:transform .35s var(--out),box-shadow .35s var(--out)}
.sec-brands-g span:hover{transform:translate(-2px,-2px);box-shadow:6px 7px 0 var(--green)}
.sec-brands-g img{max-height:52px;max-width:100%;object-fit:contain;mix-blend-mode:multiply}
.brands{border-block:1px solid var(--line);padding:16px 0;margin-bottom:36px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.brands-h{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.brands-track{display:flex;gap:16px;width:max-content;animation:tick 40s linear infinite}
.brands:hover .brands-track{animation-play-state:paused}
.brands-track span{height:64px;width:150px;flex:none;border-radius:14px;background:#fff;display:grid;place-items:center;padding:10px 16px;border:1px solid var(--line)}
.brands-track img{max-height:44px;max-width:100%;object-fit:contain;mix-blend-mode:multiply;filter:grayscale(1);opacity:.8;transition:filter .4s,opacity .4s}
.brands-track span:hover img{filter:none;opacity:1}

/* ---------- social: cards + phone mockups ---------- */
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:clamp(18px,2.4vw,32px)}
.sm-card{display:grid;gap:16px;text-align:left;cursor:pointer;perspective:900px}
.sm-card .device{transition:transform .6s var(--out),box-shadow .6s var(--out)}
.sm-card:hover .device{box-shadow:0 40px 60px -30px rgba(0,0,0,.45)}
.sm-meta{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center}
.sm-logo{grid-row:span 2;width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:15px;color:#fff}
.sm-logo img{width:100%;height:100%;object-fit:contain;padding:5px;mix-blend-mode:multiply}
.sm-meta h3{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.sm-meta .sub{font-size:13.5px;color:var(--muted)}
.sm-role{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:13.5px}
.pf{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;background:var(--ink);color:var(--bg)}
.pf.facebook,.pf.reels{background:#1877F2;color:#fff}
.pf.tiktok{background:#000;color:#fff;box-shadow:-1.5px 0 0 #25F4EE,1.5px 0 0 #FE2C55}
.device{position:relative;aspect-ratio:9/18.5;border-radius:34px;background:#0b0b0d;padding:9px;box-shadow:0 30px 50px -30px rgba(0,0,0,.35),inset 0 0 0 1.5px #2a2a2e;transform-style:preserve-3d}
.device::before{content:"";position:absolute;top:15px;left:50%;width:30%;height:18px;border-radius:99px;background:#000;transform:translateX(-50%);z-index:5}
.screen{position:relative;width:100%;height:100%;border-radius:26px;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.media{position:absolute;inset:0}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.media .slide{position:absolute;inset:0;opacity:0;transition:opacity .8s}
.media .slide.on{opacity:1}
.ph-fill{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(120% 80% at 30% 20%,color-mix(in srgb,var(--b,#333) 70%,#fff),var(--b,#333) 60%,color-mix(in srgb,var(--b,#333) 70%,#000))}
.ph-fill .lg{width:64%;max-width:180px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 20px 40px -18px rgba(0,0,0,.5)}
.ph-fill .lg img{width:100%;mix-blend-mode:multiply}
.ph-fill .ini{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}
.ph-fill .bigstat{font-size:54px;font-weight:800;letter-spacing:-.05em;line-height:1}
.ph-fill small{font-size:12px;opacity:.85;max-width:20ch}
.ph-fill .play{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:18px}
/* tiktok / reels overlay */
.tt-top{position:absolute;top:34px;left:0;right:0;text-align:center;font-size:12.5px;font-weight:600;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.tt-top span{opacity:.6;margin-right:12px}
.tt-rail{position:absolute;right:8px;bottom:84px;display:grid;gap:13px;justify-items:center;z-index:3}
.tt-rail .av{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid #fff;overflow:hidden;display:grid;place-items:center;color:#111;font-weight:800;font-size:12px}
.tt-rail .av img{width:100%;height:100%;object-fit:contain;padding:3px}
.tt-rail svg{width:25px;height:25px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.tt-cap{position:absolute;left:12px;right:52px;bottom:16px;z-index:3;font-size:12px;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tt-cap b{display:block;font-size:13px;margin-bottom:3px}
.tt-cap .snd{display:block;margin-top:5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 22%,transparent 60%,rgba(0,0,0,.55));z-index:2;pointer-events:none}
/* facebook overlay */
.screen.fb{background:#fff;color:#050505;display:flex;flex-direction:column}
.fb-bar{height:62px;padding:30px 12px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4e6eb;flex:none}
.fb-bar b{color:#1877F2;font-size:19px;font-weight:800;letter-spacing:-.03em}
.fb-bar i{display:flex;gap:6px}
.fb-bar i::before,.fb-bar i::after{content:"";width:22px;height:22px;border-radius:50%;background:#e4e6eb}
.fb-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;flex:none}
.fb-head .av{width:32px;height:32px;border-radius:50%;background:var(--b,#888);overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;border:1px solid #e4e6eb}
.fb-head .av.l{background:#fff}
.fb-head .av img{width:100%;height:100%;object-fit:contain;padding:3px}
.fb-head b{display:block;font-size:12.5px;line-height:1.2}
.fb-head span{font-size:10.5px;color:#65676B}
.fb-text{padding:0 12px 8px;font-size:12px;line-height:1.35;flex:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fb-media{position:relative;flex:1;min-height:0;background:#f0f2f5}
.fb-acts{display:flex;justify-content:space-around;padding:9px 6px 14px;border-top:1px solid #e4e6eb;font-size:11.5px;color:#65676B;font-weight:600;flex:none}

/* ---------- feature blocks (creative / marketing) ---------- */
.feats{display:grid;gap:clamp(48px,7vw,96px)}
.feat{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,4vw,64px);align-items:center}
.feat:nth-child(even) .feat-img{order:2}
.feat-img{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.feat-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--out)}
.feat-img:hover img{transform:scale(1.04)}
.feat-img .count{position:absolute;left:14px;bottom:14px;font-family:var(--mono);font-size:11px;text-transform:uppercase;padding:6px 10px;border-radius:99px;background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--ink)}
.feat-img.type{display:grid;place-items:center;background:var(--accent);color:var(--on-accent);padding:30px}
.feat-img.type b{font-size:clamp(34px,4vw,60px);font-weight:700;font-variation-settings:"wdth" 112;letter-spacing:-.04em;line-height:1;text-align:center}
.feat-body{display:grid;gap:18px}
.feat-body .mono{color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.feat-body h3{font-size:clamp(34px,4vw,58px);font-weight:700;font-variation-settings:"wdth" 108;letter-spacing:-.04em}
.feat-body .cl{color:var(--muted);margin-top:-8px}
.feat-body .lede{font-size:clamp(20px,1.9vw,26px)}
.stepper{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:14px}
.stepper-h{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;display:flex;gap:7px;align-items:center;transition:background .25s,color .25s,border-color .25s}
.steps button i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.steps button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.steps button[aria-selected="true"] i{color:inherit;opacity:.8}
.step-text{margin-top:12px;font-size:15px;min-height:3em}
.step-bar{height:3px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}
.step-bar i{display:block;height:100%;background:var(--accent);transition:width .5s var(--out)}
.feat-res{display:flex;gap:28px;flex-wrap:wrap}
.feat-res b{display:block;font-size:30px;font-weight:700;font-variation-settings:"wdth" 110;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.feat-res span{font-size:13px;color:var(--muted);max-width:20ch;display:block;margin-top:4px}
@media (max-width:900px){.feat{grid-template-columns:1fr}.feat:nth-child(even) .feat-img{order:0}}

/* ---------- sheet (social detail) ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--ink) 40%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.sheet.open{opacity:1;visibility:visible}
.sheet-box{position:relative;width:min(1120px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--bg);border-radius:28px;border:1px solid var(--line);display:grid;grid-template-columns:1.05fr 1fr;transform:translateY(30px) scale(.97);transition:transform .5s var(--out)}
.sheet.open .sheet-box{transform:none}
.sheet-posts{background:var(--surface);border-right:1px solid var(--line);padding:32px 24px;display:flex;gap:18px;overflow-x:auto;align-items:center;scroll-snap-type:x mandatory;min-height:480px}
.sheet-posts .device{flex:none;width:min(260px,62vw);scroll-snap-align:center}
.sheet-posts:has(.device:only-child){justify-content:center}
.sheet-body{padding:clamp(24px,3vw,40px);display:grid;gap:20px;align-content:start}
.sheet-body h3{font-size:clamp(30px,3.4vw,46px);font-weight:700;font-variation-settings:"wdth" 108;letter-spacing:-.04em}
.sheet-body h4{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:400;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sheet-body ul{list-style:none;display:grid;gap:7px;font-size:15px}
.sheet-body li{padding-left:18px;position:relative}
.sheet-body li::before{content:"→";position:absolute;left:0;color:var(--accent);font-size:13px;top:2px}
.sheet-x{position:absolute;top:14px;right:14px;z-index:3}
.sheet-nav{display:flex;gap:8px;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid var(--line)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;background:var(--ink);color:var(--bg);text-decoration:none;font-size:14px;font-weight:600;transition:background .3s}
.links a:hover{background:var(--accent);color:var(--on-accent)}
.links a.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.links a.alt:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:860px){.sheet{padding:0;place-items:end center}.sheet-box{grid-template-columns:1fr;border-radius:24px 24px 0 0;max-height:92vh}.sheet-posts{border-right:0;border-bottom:1px solid var(--line);min-height:0;padding:24px}}

/* ---------- case study overlay ---------- */
.case{position:fixed;inset:0;z-index:85;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;visibility:hidden;clip-path:circle(0 at 50% 50%)}
.case.open{visibility:visible}
.case-close{position:fixed;top:14px;right:var(--gut);z-index:86;height:42px;padding:0 18px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transform:translateY(-12px);transition:opacity .3s,transform .5s var(--out)}
.case-close.on{opacity:1;pointer-events:auto;transform:none}
.case .st{opacity:0;transform:translateY(30px);transition:opacity .9s var(--out),transform .9s var(--out)}
.case.ready .st{opacity:1;transform:none}
.cs-in{max-width:1320px;margin:0 auto;padding:clamp(80px,9vw,120px) var(--gut) 0}
.cs-meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin-bottom:18px}
.cs-in h2{font-size:clamp(48px,8vw,128px);font-weight:700;font-variation-settings:"wdth" 115;letter-spacing:-.05em;line-height:.92}
.cs-in .cl{color:var(--muted);margin-top:14px;font-size:17px}
.cs-cover{margin-top:clamp(28px,4vw,52px);border-radius:24px;overflow:hidden;aspect-ratio:16/8;background:var(--surface)}
.cs-cover img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 1.6s var(--out)}
.case.ready .cs-cover img{transform:none}
.cs-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:clamp(20px,3vw,48px);padding-block:clamp(40px,5vw,72px);border-bottom:1px solid var(--line)}
.cs-grid h4,.cs-block h4{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;color:var(--muted);font-weight:400;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cs-grid ul{list-style:none;display:grid;gap:8px}
.cs-grid li{padding-left:18px;position:relative;font-size:15.5px}
.cs-grid li::before{content:"→";position:absolute;left:0;color:var(--accent);font-size:13px;top:2px}
.cs-block{padding-block:clamp(36px,4vw,60px);border-bottom:1px solid var(--line)}
.plan{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;counter-reset:pl;position:relative}
.plan li{counter-increment:pl;padding:18px 18px 18px 0;border-top:2px solid var(--line);position:relative}
.plan li::before{content:counter(pl,decimal-leading-zero);display:block;font-family:var(--mono);font-size:12px;color:var(--accent);margin-bottom:10px}
.plan li::after{content:"";position:absolute;top:-2px;left:0;height:2px;width:0;background:var(--accent);transition:width 1s var(--out)}
.case.ready .plan li::after{width:100%}
.plan b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px}
.plan p{font-size:14.5px;color:var(--muted)}
.cs-sec{display:grid;grid-template-columns:220px 1fr;gap:clamp(16px,3vw,44px)}
.cs-sec+.cs-sec{margin-top:28px}
.cs-sec h3{font-size:24px;font-weight:600;letter-spacing:-.02em}
.cs-sec p,.cs-sec li{max-width:68ch;font-size:16px}
.cs-sec ol{list-style:none;display:grid;gap:10px;counter-reset:c}
.cs-sec ol li{counter-increment:c;padding-left:38px;position:relative}
.cs-sec ol li::before{content:counter(c,decimal-leading-zero);position:absolute;left:0;top:3px;font-family:var(--mono);font-size:12px;color:var(--accent)}
.gal{display:grid;gap:clamp(14px,2vw,24px)}
.gal figure{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface);cursor:zoom-in}
.gal img{width:100%;height:auto;transition:transform 1s var(--out)}
.gal figure:hover img{transform:scale(1.015)}
.gal figcaption{padding:12px 16px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.masonry{columns:3 240px;column-gap:14px}
.masonry figure{break-inside:avoid;margin-bottom:14px;border-radius:14px;overflow:hidden;cursor:zoom-in}
.masonry img{width:100%;height:auto;transition:transform 1s var(--out)}
.masonry figure:hover img{transform:scale(1.04)}
.cs-next{display:block;margin:clamp(40px,6vw,80px) calc(-1 * var(--gut)) 0;padding:clamp(40px,6vw,72px) var(--gut);background:var(--ink);color:var(--bg);text-decoration:none;text-align:left;width:calc(100% + 2 * var(--gut))}
.cs-next .mono{opacity:.65}
.cs-next strong{display:block;font-size:clamp(40px,6vw,96px);font-weight:700;font-variation-settings:"wdth" 112;letter-spacing:-.04em;line-height:1;margin-top:8px;transition:transform .6s var(--out)}
.cs-next:hover strong{transform:translateX(16px)}
@media (max-width:900px){.cs-grid,.cs-sec{grid-template-columns:1fr}}
.lede{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(22px,2.3vw,32px);line-height:1.25;letter-spacing:-.01em;max-width:36ch}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}


:root{--bg:var(--cream);--surface:var(--paper);--accent:var(--green);--accent-soft:var(--mint);--on-accent:var(--cream);--serif:var(--body)}
@keyframes tick{to{transform:translateX(-50%)}}
.ibtn{height:36px;min-width:36px;padding:0 12px;border-radius:99px;border:1.5px solid var(--green);background:var(--paper);color:var(--green);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;transition:background .3s,color .3s}
.ibtn:hover{background:var(--green);color:var(--cream)}
.tabs{border:1.5px solid var(--green);background:var(--paper)}
.tabs .ind{background:var(--green)}
.tabs button[aria-selected="true"]{color:var(--cream)}
.tabs button{color:var(--green)}
.feat-img{border:1.5px solid var(--green);text-decoration:none;display:block}
.feat-img.type{display:grid}
.feat-img.logo{display:grid;place-items:center;background:#fff;padding:clamp(28px,6%,64px)}
.feat-img.logo img{width:auto;height:auto;max-width:78%;max-height:62%;object-fit:contain}
.feat-img.logo:hover img{transform:scale(1.05)}
.feat-img .count{background:var(--paper);color:var(--green);border:1px solid var(--green)}
.feat-img.type{background:var(--green);color:var(--cream)}
.feat-img.type b{font-family:var(--display);font-weight:800}

/* showcase rows, campaign phases, gallery layout */
.show{display:grid;grid-template-columns:repeat(var(--n,6),minmax(118px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.show-it{display:grid;gap:10px;text-align:center;align-content:start}
.show-img{aspect-ratio:4/5;border-radius:22px;background:var(--paper);border:1.5px solid var(--line);display:grid;place-items:center;padding:14px;overflow:hidden;transition:border-color .3s,background .3s;cursor:zoom-in}
.show-img img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .6s var(--out)}
.show-it:hover .show-img{border-color:var(--green);background:var(--mint)}
.show-it:hover .show-img img{transform:translateY(-8px) rotate(-4deg) scale(1.06)}
.sw{width:66%;height:66%;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.show-it figcaption b{display:block;font-family:var(--display);font-weight:800;color:var(--green);font-size:16px;line-height:1.15}
.show-it figcaption span{display:block;margin-top:3px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.phase{border:1.5px solid var(--green);border-radius:24px;background:var(--paper);padding:24px;display:grid;gap:16px;align-content:start;transition:transform .5s var(--out),box-shadow .5s var(--out)}
.phase:hover{transform:translateY(-6px);box-shadow:8px 10px 0 var(--pink)}
.phase:nth-child(2){background:var(--mint)}
.phase:nth-child(3){background:#FBE3FF}
.phase header .mono{color:var(--green)}
.phase h3{font-family:var(--display);font-weight:800;font-size:clamp(30px,3vw,42px);color:var(--green);line-height:1;margin-top:6px}
.phase dl{display:grid;gap:4px}
.phase dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted);margin-top:8px}
.phase dd{font-size:15px;line-height:1.45}
.gal{grid-template-columns:repeat(2,1fr)}
.gal figure.wide{grid-column:1/-1}
.gal figure.plain{background:transparent;border:0;cursor:zoom-in}
.gal figure.plain img{padding:8px 0}
.gal figure.plain figcaption{border-top:1.5px solid var(--line)}
@media (max-width:900px){.phases{grid-template-columns:1fr}}
@media (max-width:700px){.gal{grid-template-columns:1fr}}

/* clickable characters */
.show-hint{font-size:14.5px;color:var(--muted);margin:-2px 0 16px}
.show-it.pop{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:center}
.show-it.pop .show-img{position:relative;cursor:pointer}
.show-it .tap{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--green);color:var(--cream);font-style:normal;font-weight:700;display:grid;place-items:center;font-size:16px;transform:scale(.85);transition:transform .4s var(--out),background .3s}
.show-it.pop:hover .tap,.show-it.pop:focus-visible .tap{transform:scale(1.1) rotate(90deg);background:var(--pink);color:var(--ink)}
.charpop{position:fixed;inset:0;z-index:92;background:rgba(16,41,27,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.charpop.open{opacity:1;visibility:visible}
.cp-box{position:relative;width:min(900px,100%);max-height:calc(100vh - 40px);overflow:auto;display:grid;grid-template-columns:1.1fr 1fr;background:var(--cream);border:1.5px solid var(--green);border-radius:30px;box-shadow:10px 12px 0 var(--green);transform:translateY(24px) scale(.96);transition:transform .5s var(--out)}
.charpop.open .cp-box{transform:none}
.cp-stage{position:relative;background:var(--mint);display:grid;place-items:center;padding:34px;min-height:400px;border-radius:28px 0 0 28px;overflow:hidden}
.cp-stage::before{content:"";position:absolute;width:72%;aspect-ratio:1;border-radius:50%;background:var(--pink);opacity:.4}
.cp-stage img{position:relative;max-height:340px;max-width:100%;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(16,41,27,.18))}
.cp-stage img.pop{animation:cpIn .75s var(--out)}
@keyframes cpIn{0%{transform:scale(.3) rotate(-18deg) translateY(40px);opacity:0}60%{transform:scale(1.08) rotate(4deg);opacity:1}100%{transform:none}}
.cp-body{padding:34px 30px;display:grid;gap:14px;align-content:center}

.cp-nav{display:flex;justify-content:space-between;gap:8px;margin-top:6px}

@media (max-width:720px){.cp-box{grid-template-columns:1fr}.cp-stage{min-height:250px;border-radius:28px 28px 0 0}.cp-stage img{max-height:210px}}

.vf-tags span:first-child{background:var(--pink);color:var(--ink)}
.vf:hover .vf-card.l{transform:rotate(-17deg) translate(-14px,-6px)}

/* video folder modal */

.post-h b{display:block;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-h div{min-width:0}
.post-h div span{font-size:11.5px;color:var(--muted)}
.post-m{position:relative;aspect-ratio:3/4;background:#111;overflow:hidden}
.post-m.facebook{aspect-ratio:4/5}
.post-m img,.post-m video{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s var(--out)}
.post:hover .post-m img{transform:scale(1.04)}
.post-views{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#fff;font-size:12.5px;font-weight:700}
.post-views svg{width:12px;height:12px;fill:#fff}
.post-k{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 14px 4px}
.post-k span{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.post-k svg{width:15px;height:15px;fill:var(--green)}
.post-k span[title="likes"] svg{fill:#E0457B}
.post-k b{font-weight:700}
.post-k i{font-style:normal;color:var(--muted);font-size:11.5px}
.post-c{padding:6px 14px 0;font-weight:600;font-size:14.5px;line-height:1.35}
.post-a{display:flex;gap:8px;padding:12px 14px 0}
.er{flex:1;display:grid;gap:2px;padding:10px 12px;border-radius:14px;background:var(--mint);border:1.5px solid var(--green)}
.er b{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;color:var(--green)}
.er span{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--muted)}
.er.alt{background:color-mix(in srgb,var(--pink) 35%,var(--paper))}
.post{padding-bottom:16px}
.posts{align-items:stretch}
.post-a{margin-top:auto;padding-top:14px!important}
.post-n{margin:12px 14px 16px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.post-n .mono{display:block;color:var(--green);font-size:10.5px;margin-bottom:4px}
.ch-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border:1.5px solid var(--green);border-radius:22px;overflow:hidden;background:var(--paper)}
.ch-res div{padding:22px;border-right:1.5px solid var(--line)}
.ch-res div:last-child{border-right:0}
.ch-res b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(30px,3.4vw,46px);color:var(--green);letter-spacing:-.04em;line-height:1}
.ch-res span{display:block;margin-top:8px;font-size:13.5px;color:var(--muted);max-width:24ch}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(14px,2vw,24px)}
.ins article{padding:22px;border-radius:22px;background:var(--green);color:var(--cream);display:grid;gap:10px;align-content:start}
.ins article:nth-child(even){background:var(--mint);color:var(--ink)}
.ins .mono{color:var(--pink);font-size:11px}
.ins article:nth-child(even) .mono{color:var(--green)}
.ins h3{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.ins article:nth-child(odd) h3{color:var(--cream)}
.ch-sec .brand-body{padding-top:8px}
.ins p{font-size:14.5px;line-height:1.55;opacity:.92}
.sm-kpis{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1;margin-top:6px}
.sm-kpis span{font-size:12px;padding:4px 10px;border-radius:99px;border:1.5px solid var(--green);background:var(--paper)}
.sm-kpis b{color:var(--green);font-family:var(--display);font-weight:800}
.ch-note{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:none;margin:-8px 0 26px;max-width:80ch}
@media (max-width:900px){.ch-obj{grid-template-columns:1fr}.kpi-r{grid-template-columns:1fr 1fr;gap:6px 14px}.kpi-r.head{display:none}.kpi-r .m{grid-column:1/-1}.kpi-r .tg::before{content:attr(data-l) " · ";font-family:var(--mono);font-size:10.5px}.kpi-r .pr{grid-column:1/-1}.ch-res div{border-right:0;border-bottom:1.5px solid var(--line)}}
@media (max-width:600px){.posts{grid-auto-flow:column;grid-auto-columns:78vw;grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1 * var(--gut));padding:0 var(--gut) 18px}.post{scroll-snap-align:center}.funnel li{margin-left:calc(var(--k) * 8px)}}
.sm-card{text-decoration:none;color:inherit}

.used a{color:var(--green);font-weight:600;border-bottom:1.5px solid var(--pink);margin-right:12px;text-decoration:none}
.used a:hover{color:var(--ink)}
.stats-title{font-family:var(--display);font-size:clamp(28px,3.2vw,46px);font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--green);text-align:left;margin-bottom:clamp(16px,2vw,24px)}
</style>
</head>

</aside>

<script>
(function(){
let D = window.PORTFOLIO;
let SAVED = JSON.stringify(D);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain = s => String(s ?? "").replace(/\*/g, "");
const arr = v => Array.isArray(v) ? v : [];
const pad = n => String(n).padStart(2, "0");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fine = matchMedia("(hover:hover) and (pointer:fine)").matches;
const pending = {};
const src = p => (pending[p] && pending[p].url) || p || "";
const isVid = p => /\.(mp4|webm|mov)(\?|$)/i.test(p || "");
const initials = s => plain(s).split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join("").toUpperCase();
let skillSel = null, firstPaint = true, page = "home";

/* ---------- toast + copy ---------- */
const toast = (t, ms = 2400) => { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("on"), ms); };
async function copy(text, label){ try { await navigator.clipboard.writeText(text); toast(`Copied ${label || text}`); } catch(_) { toast(`Select and copy: ${text}`, 4000); } }
document.addEventListener("click", e => { const b = e.target.closest("[data-copy]"); if (b) copy(b.dataset.copy); });

/* ---------- flower + badge ---------- */
function flower(color = "#F29FFF", center = "#006838"){
  let petals = "";
  for (let i = 0; i < 5; i++){ const a = (-90 + i * 72) * Math.PI / 180; petals += `<circle cx="${(50 + 25 * Math.cos(a)).toFixed(2)}" cy="${(50 + 25 * Math.sin(a)).toFixed(2)}" r="22" fill="${color}"/>`; }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${petals}<circle cx="50" cy="50" r="20" fill="${color}"/><path d="M50 37C51.6 45 55 48.4 63 50C55 51.6 51.6 55 50 63C48.4 55 45 51.6 37 50C45 48.4 48.4 45 50 37Z" fill="${center}"/></svg>`;
}
$$(".flower-slot").forEach(el => { el.outerHTML = flower(el.dataset.flower, el.dataset.center || "#006838"); });
function badgeSVG(txt){
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><defs><path id="cp" d="M60 60 m-46 0 a46 46 0 1 1 92 0 a46 46 0 1 1 -92 0"/></defs><circle cx="60" cy="60" r="58" fill="#006838"/><text font-family="Space Mono, monospace" font-size="10.4" letter-spacing="1.6" fill="#FFF9E6"><textPath href="#cp">${esc(txt)}</textPath></text><g transform="translate(38 38) scale(.44)">${flower("#F29FFF","#006838").replace(/<\/?svg[^>]*>/g,"")}</g></svg>`;
}
function splitWords(el){
  const walk = node => [...node.childNodes].forEach(ch => {
    if (ch.nodeType === 3){
      const frag = document.createDocumentFragment();
      ch.textContent.split(/(\s+)/).forEach(part => {
        if (!part) return;
        if (/^\s+$/.test(part)) frag.appendChild(document.createTextNode(part));
        else { const w = document.createElement("span"); w.className = "w"; const i = document.createElement("span"); i.textContent = part; w.appendChild(i); frag.appendChild(w); }
      });
      ch.replaceWith(frag);
    } else if (ch.nodeType === 1) walk(ch);
  });
  walk(el);
  el.querySelectorAll(".w>span").forEach((s,i) => s.style.transitionDelay = (i * 0.035) + "s");
}
const field = $("#field");
for (let i = 0; i < 20; i++) field.insertAdjacentHTML("beforeend", flower(i % 5 === 2 ? "#F29FFF" : "#2E8B57", i % 5 === 2 ? "#006838" : "#CAF4CE"));
const flowers = [...field.querySelectorAll("svg")];

/* ---------- data helpers ---------- */
const sections = () => arr(D.sections).length ? arr(D.sections) : [{id:"social",label:"Social media"},{id:"creative",label:"Creative project"},{id:"marketing",label:"Marketing"}];
const inSec = id => arr(D.projects).filter(p => p.section === id);
const secOf = id => sections().find(s => s.id === id) || {id, label: id};
const isSocial = p => (p.kind || (p.section === "social" ? "social" : "case")) === "social";
const thumbOf = p => (arr(p.posts).find(x => x.src && !isVid(x.src)) || {}).src || p.cover || (arr(p.gallery)[0] || {}).src || "";
const RESERVED = ["home","about","experience","work","contact"];

/* ---------- phone mockups ---------- */
const IC = {
  heart:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.5 1.1 4.2 2.3h2c.7-1.2 2.1-2.3 4.2-2.3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21Z"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.4 1.2 4.6 3.1 6.1L4 21l4.3-1.9c1.2.4 2.4.6 3.7.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3Z"/></svg>',
  mark:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M14 4v4C7 9 4 13 3 19c2.5-3.5 6-5 11-5v4l7-7-7-7Z"/></svg>'
};
function mediaHTML(p, posts){
  if (!posts.length){
    const r = arr(p.results)[0];
    return `<div class="ph-fill" style="--b:${esc(p.accent || "#333")}">
      ${p.logo ? `<div class="lg"><img src="${esc(src(p.logo))}" alt=""></div>` : (r ? `<div class="bigstat">${esc(r.big)}</div><small>${esc(r.label)}</small>` : `<div class="ini">${esc(initials(p.title))}</div>`)}
      ${arr(p.links)[0] ? `<div class="play">▶</div><small>Watch on ${p.platform === "tiktok" ? "TikTok" : "Facebook"}</small>` : ""}
    </div>`;
  }
  return posts.map((po,i) => `<div class="slide${i ? "" : " on"}">${isVid(po.src)
    ? `<video src="${esc(src(po.src))}" muted loop playsinline preload="metadata"></video>`
    : `<img src="${esc(src(po.src))}" alt="${esc(po.caption || p.title)}" loading="lazy">`}</div>`).join("");
}
function avatar(p, cls){
  return p.logo ? `<span class="${cls} l"><img src="${esc(src(p.logo))}" alt=""></span>` : `<span class="${cls}" style="background:${esc(p.accent || "#333")}">${esc(initials(p.title))}</span>`;
}
function phone(p, posts, cap){
  const pl = p.platform || "tiktok";
  const caption = cap ?? (posts[0] && posts[0].caption) ?? p.summary ?? "";
  if (pl === "facebook"){
    return `<div class="device"><div class="screen fb">
      <div class="fb-bar"><b>facebook</b><i></i></div>
      <div class="fb-head">${avatar(p,"av")}<div><b>${esc(p.handle || p.title)}</b><span>${esc(p.year || "")} · 🌐</span></div></div>
      <div class="fb-text">${esc(caption)}</div>
      <div class="fb-media"><div class="media">${mediaHTML(p, posts)}</div></div>
      <div class="fb-acts"><span>👍 Like</span><span>💬 Comment</span><span>↗ Share</span></div>
    </div></div>`;
  }
  return `<div class="device"><div class="screen">
    <div class="media">${mediaHTML(p, posts)}</div><div class="shade"></div>
    <div class="tt-top">${pl === "reels" ? "Reels" : "<span>Following</span>For You"}</div>
    <div class="tt-rail">${avatar(p,"av")}${IC.heart}${IC.chat}${pl === "reels" ? "" : IC.mark}${IC.share}</div>
    <div class="tt-cap"><b>${esc(p.handle || p.title)}</b>${esc(caption)}<span class="snd">♫ original sound · ${esc(plain(p.title))}</span></div>
  </div></div>`;
}
const logoBox = (p, cls = "sm-logo") => `<span class="${cls}" style="${p.logo ? "" : `background:${esc(p.accent || "#333")}`}">${p.logo ? `<img src="${esc(src(p.logo))}" alt="">` : esc(initials(p.title))}</span>`;
const pfBadge = p => `<span class="pf ${esc(p.platform || "tiktok")}">${esc(p.platform === "reels" ? "FB Reels" : (p.platform || "tiktok"))}</span>`;
function socialCard(p){
  const posts = arr(p.posts).filter(x => x.src);
  return `<a class="sm-card rv" href="#${esc(p.id)}" data-pid="${esc(p.id)}" data-cursor="View" aria-label="${esc(plain(p.title))}: open project page">
    ${phone(p, posts)}
    <div class="sm-meta">${logoBox(p)}<h3>${esc(p.title)}</h3><span class="sub">${esc(p.client)}</span>
      <div class="sm-role">${pfBadge(p)}<span>${esc(p.role)}</span></div>${arr(p.results).length && arr(p.kpis).length ? `<div class="sm-kpis">${arr(p.results).slice(0,2).map(r => `<span><b>${esc(r.big)}</b> ${esc(r.label.split(/[,(]/)[0].trim())}</span>`).join("")}</div>` : ""}</div>
  </a>`;
}
function featBlock(p, i){
  const plan = arr(p.plan);
  const imgs = arr(p.gallery).length + arr(p.series).reduce((n,s) => n + arr(s.photos).length, 0);
  return `<article class="feat rv" data-id="${esc(p.id)}">
    ${p.cardLogo ? (() => { const g = arr(p.gallery).filter(x => x.src); const t1 = g[0] ? g[0].src : p.cover, t2 = g[1] ? g[1].src : "";
      return `<a class="feat-img ffold" href="#${esc(p.id)}" data-cursor="Open" aria-label="Open ${esc(plain(p.title))}">
        <div class="vf-back"></div>
        <div class="vf-card l">${t1 ? `<img src="${esc(src(t1))}" alt="" loading="lazy">` : ""}</div>
        <div class="vf-card c"><img src="${esc(src(p.cardLogo))}" alt="${esc(plain(p.client || p.title))} logo" loading="lazy"></div>
        <div class="vf-card r">${t2 ? `<img src="${esc(src(t2))}" alt="" loading="lazy">` : ""}</div>
        <div class="vf-front"><span class="mono">Case study</span><b>${esc(p.title)}</b></div>
        ${imgs ? `<span class="count">${imgs} images inside</span>` : ""}</a>`; })()
      : p.cover ? `<a class="feat-img" href="#${esc(p.id)}" data-cursor="Open" aria-label="Open ${esc(plain(p.title))}"><img src="${esc(src(p.cover))}" alt="${esc(plain(p.title))}" loading="lazy">${imgs ? `<span class="count">${imgs} images inside</span>` : ""}</a>`
      : `<a class="feat-img type" href="#${esc(p.id)}" data-cursor="Open"><b>${esc(p.title)}</b></a>`}
    <div class="feat-body">
      <div class="mono"><span>${pad(i+1)}</span><span>${esc(p.year)}</span><span>${esc(p.role)}</span></div>
      <h3>${esc(p.title)}</h3><p class="cl">${esc(p.client)}</p>
      <p class="lede">${esc(p.summary)}</p>
      ${plan.length ? `<div class="stepper" data-stepper data-pid="${esc(p.id)}">
        <div class="stepper-h"><span>How I planned it</span><span data-sn>01 / ${pad(plan.length)}</span></div>
        <div class="steps" role="tablist">${plan.map((s,j) => `<button role="tab" data-step="${j}" aria-selected="${j === 0}"><i>${pad(j+1)}</i>${esc(s.step)}</button>`).join("")}</div>
        <p class="step-text" data-st>${esc(plan[0].text)}</p>
        <div class="step-bar"><i style="width:${100/plan.length}%"></i></div>
      </div>` : ""}
      ${arr(p.results).length ? `<div class="feat-res">${arr(p.results).slice(0,3).map(r => `<div><b>${esc(r.big)}</b><span>${esc(r.label)}</span></div>`).join("")}</div>` : ""}
      <div><a class="pill solid" href="#${esc(p.id)}">Open case study <span class="arr">→</span></a></div>
    </div>
  </article>`;
}
function collageOf(list){
  const out = [];
  list.forEach(p => {
    arr(p.posts).forEach(x => { if (x.src && !isVid(x.src)) out.push(x.src); });
    if (p.cover) out.push(p.cover);
    arr(p.series).forEach(se => arr(se.photos).slice(0,3).forEach(ph => out.push(ph)));
    arr(p.gallery).slice(0,3).forEach(g => { if (g.src) out.push(g.src); });
    arr(p.showcase).forEach(sc => arr(sc.items).slice(0,2).forEach(it => { if (it.pack) out.push(it.pack); }));
  });
  const uniq = [...new Set(out)], res = [];
  if (!uniq.length) return res;
  for (let k = 0; res.length < 12; k++) res.push(uniq[k % uniq.length]);
  return res;
}
function goCard(s, i){
  const list = inSec(s.id), imgs = collageOf(list);
  return `<a class="pf-card rv" href="#${esc(s.id)}" data-cursor="Open" aria-label="${esc(s.label)}: view all">
    <div class="pf-tile">
      <div class="pf-collage" aria-hidden="true">${imgs.map(t => `<img src="${esc(src(t))}" alt="" loading="lazy">`).join("")}</div>
      <div class="pf-top"><span class="mono">${pad(i+1)} · ${list.length} ${list.length === 1 ? "project" : "projects"}</span><h3>${esc(s.label)}</h3></div>
    </div>
    <span class="pf-all">View all <span class="arr">→</span></span>
  </a>`;

/* ---------- draggable stickers ---------- */
function bindSticker(st){
  let sx, sy, ox, oy;
  st.addEventListener("pointerdown", e => { st.setPointerCapture(e.pointerId); st.classList.add("drag"); sx = e.clientX; sy = e.clientY; ox = st.offsetLeft; oy = st.offsetTop; });
  st.addEventListener("pointermove", e => {
    if (!st.classList.contains("drag")) return;
    const ar = st.parentElement.getBoundingClientRect();
    st.style.left = Math.max(-20, Math.min(ar.width - st.offsetWidth + 20, ox + e.clientX - sx)) + "px";
    st.style.top = Math.max(-20, Math.min(ar.height - st.offsetHeight + 20, oy + e.clientY - sy)) + "px";
    st.style.rotate = Math.max(-18, Math.min(18, (e.clientX - sx) * 0.08)) + "deg";
  });
  const end = () => st.classList.remove("drag"); st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end);
}

function trText(raw){

  let r = has(UI_VI, t) ? UI_VI[t] : (has(VI_C(), t) ? VI_C()[t] : undefined);
  if (r === undefined){ for (const [re, f] of RULES_VI){ if (re.test(t)){ r = t.replace(re, f); break; } } }

  const els = [root, ...root.querySelectorAll(I18N_ATTRS.map(a => "[" + a + "]").join(","))];
  for (const el of els){
    if (!el.getAttribute || skip(el)) continue;
    let saved = attrEN.get(el);

async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const png = file.type === "image/png", ctx = c.getContext("2d");
    if (!png){ ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); }
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, png ? "image/png" : "image/jpeg", 0.85));
    return {blob: blob || file, ext: png ? "png" : "jpg"};
  } catch(_) { return {blob: file, ext: (file.name.split(".").pop() || "jpg").toLowerCase()}; }
}
async function addImage(file){

  pending[path] = {blob, url: URL.createObjectURL(blob), saved: false};

}

      const ctr = mk("span","ed-ctr");
      const mkB = (txt, lbl, fn) => { const b = mk("button"); b.type = "button"; b.textContent = txt; b.setAttribute("aria-label", lbl); b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); fn(b); }); return b; };
      ctr.append(
        mkB("↑","Đưa lên", () => { if (i > 0){ [list[i-1], list[i]] = [list[i], list[i-1]]; draw(i-1); changed(); } }),
        mkB("↓","Đưa xuống", () => { if (i < list.length - 1){ [list[i+1], list[i]] = [list[i], list[i+1]]; draw(i+1); changed(); } }),
        mkB("✕","Xoá", b => {
          if (b.classList.contains("armed")){ list.splice(i,1); draw(-1); changed(); return; }
          b.classList.add("armed"); b.textContent = "Xoá?"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "✕"; }, 3000);
        })
      );
      s.append(st, ctr); d.appendChild(s);
      const inner = mk("div","ed-in"); d.appendChild(inner);
      let filled = false;
      const fill = () => { inner.innerHTML = ""; def.f.forEach(fd => edField(fd, item, inner, fill)); filled = true; };
      if (d.open) fill();
      d.addEventListener("toggle", () => { if (d.open && !filled) fill(); });
      d.addEventListener("input", () => { st.textContent = titleOf(item); });
      box.appendChild(d);
    });
    const add = mk("button","ed-add"); add.type = "button"; add.textContent = "+ " + def.add;
    add.addEventListener("click", () => { list.push(def.tpl()); draw(list.length - 1); changed(); });
    box.appendChild(add);
  };
  draw(-1);
}
function drawEditor(){
  $("#edTabs").innerHTML = "";
  TABS.forEach(([k,l]) => {
    const b = mk("button"); b.type = "button"; b.setAttribute("role","tab"); b.textContent = l; b.setAttribute("aria-selected", k === tab);
    b.addEventListener("click", () => { tab = k; drawEditor(); edBody.scrollTop = 0; });
    $("#edTabs").appendChild(b);
  });
  edBody.innerHTML = `<div class="ed-help">${HELP[tab]}</div>`;
  if (tab === "profile"){ D.profile = D.profile || {}; SCHEMA.profile.forEach(f => edField(f, D.profile, edBody)); }
  else if (tab === "photos"){ edField(L("brands","Logo thương hiệu (dải logo ở trang Social media)","imgs"), D, edBody); }
  else if (tab === "texts"){
    D.texts = D.texts || {};
    SCHEMA.texts.forEach(f => edField(f, D.texts, edBody));
    edField(SCHEMA.sectionsDef, D, edBody);
    edField(L("updated","Dòng “Updated …” ở chân trang",null,{h:"Tự cập nhật thành tháng hiện tại mỗi khi lưu."}), D, edBody);
  } else if (tab === "json"){
    const a = mk("textarea"); a.style.minHeight = "50vh"; a.style.fontFamily = "var(--mono)"; a.style.fontSize = "12px";
    a.value = JSON.stringify(D, null, 2); a.setAttribute("aria-label","Nội dung JSON");
    const row = mk("div"); row.style.cssText = "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap";
    const apply = mk("button","ed-small"); apply.textContent = "Áp dụng JSON";
    apply.onclick = () => { try { const v = JSON.parse(a.value); if (!v || !v.profile) throw 0; D = v; changed(); toast("Đã áp dụng. Bấm Lưu & đăng để đăng."); } catch(_) { toast("JSON chưa đúng định dạng, kiểm tra lại dấu ngoặc và dấu phẩy."); } };
    const cp = mk("button","ed-small"); cp.textContent = "Sao chép";
    cp.onclick = async () => { try { await navigator.clipboard.writeText(a.value); toast("Đã sao chép nội dung"); } catch(_) { a.select(); toast("Nhấn Ctrl/Cmd + C để sao chép"); } };
    row.append(apply, cp); edBody.append(a, row);
  } else { const def = SCHEMA[tab]; if (!Array.isArray(D[def.k])) D[def.k] = []; edList(def, D[def.k], edBody); }
}
function slug(s){
  let v = String(s || "").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[đĐ]/g,"d").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  if (!v) v = "project";
  if (/^(settings|sidebar|customize|upgrade|downloads|comment|work|about|photos|experience|contact|home|social|creative|marketing|video|photography|campaigns)$/.test(v)) v += "-project";
  return v;
}
function normalize(){
  const seen = new Set();
  arr(D.projects).forEach(p => {
    let id = /^[A-Za-z0-9-]+$/.test(p.id || "") ? p.id : slug(p.title);
    const base = id; let n = 2; while (seen.has(id)) id = base + "-" + (n++);
    p.id = id; seen.add(id);
    if (p.link && !p.link.url && !p.link.label) delete p.link;
  });
  D.updated = new Date().toLocaleDateString("en-GB", {month:"long", year:"numeric"});
}
function serialize(){ return "/* Phuong Hoa's portfolio: content file. Edit on the site with \"Chỉnh sửa trang\". */\nwindow.PORTFOLIO = " + JSON.stringify(D, null, 2) + ";\n"; }
async function save(){
  if (!ART || saving || !dirty) return;
  saving = true; edSave.disabled = true; edUndo.disabled = true; setState("Đang lưu…");
  normalize();
  const all = JSON.stringify(D);
  const files = {"content.js": {content: serialize(), contentType: "text/javascript"}};
  const up = Object.keys(pending).filter(p => !pending[p].saved && all.includes(p));
  up.forEach(p => files[p] = pending[p].blob);
  try {
    await ART.publish(files);
    Object.keys(pending).forEach(p => pending[p].saved = true);
    SAVED = JSON.stringify(D); saving = false; changed(); drawEditor();
    setState("✓ Đã lưu và đăng lúc " + new Date().toLocaleTimeString("vi-VN", {hour:"2-digit", minute:"2-digit"}));
    toast("Đã đăng. Mọi người sẽ thấy bản mới.");
  } catch(e) {
    saving = false; changed();
    const msg = {
      conflict: "Trang vừa được cập nhật ở nơi khác và sẽ tải lại. Hãy sửa lại sau khi tải xong.",
      not_writer: "Tài khoản này không có quyền sửa trang.",
      not_granted: "Chế độ xem này không cho phép lưu. Hãy mở trang trên claude.ai khi đã đăng nhập.",
      capability_disabled: "Không lưu được ở chế độ xem này (có thể do trang đang chia sẻ công khai). Vào tab Nâng cao, bấm Sao chép rồi gửi cho Claude.",
      too_large: "Ảnh quá lớn. Hãy thử ảnh nhỏ hơn.",
      rate_limited: "Bạn lưu hơi nhanh, đợi vài giây rồi thử lại.",
      invalid_content: "Có tệp không hợp lệ. Hãy thử lại với ảnh JPG hoặc PNG."
    }[e && e.code] || "Chưa lưu được, thử lại sau ít phút.";
    setState("Lỗi: chưa lưu", "dirty"); toast(msg, 6000);
  }
}
function openEditor(){ if (LANG !== "en") setLang("en"); ed.hidden = false; drawEditor(); requestAnimationFrame(() => ed.classList.add("open")); fab.hidden = true; }
function closeEditor(){ ed.classList.remove("open"); setTimeout(() => { ed.hidden = true; fab.hidden = false; }, 550); }
fab.addEventListener("click", openEditor);
$("#edX").addEventListener("click", closeEditor);
edSave.addEventListener("click", save);
edUndo.addEventListener("click", () => {
  D = JSON.parse(SAVED);
  Object.keys(pending).forEach(p => { if (!pending[p].saved) delete pending[p]; });
  changed(); drawEditor(); toast("Đã huỷ các thay đổi chưa lưu");
});
addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [a, user] = await Promise.all([claude.use("artifact"), claude.use("user")]);
    if (!a || !user) return;
    if (!((user.isOwner && user.isOwner()) || (user.canEdit && user.canEdit()))) return;
    ART = a; fab.hidden = false;
  } catch(_) {}
})();
})();
</script>
